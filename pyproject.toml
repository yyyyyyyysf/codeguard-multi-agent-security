[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeguard"
version = "0.1.0"
description = "Multi-Agent Code Repository Security Analysis Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CodeGuard Developer"}
]
keywords = ["security", "agent", "code-analysis", "cve", "devsecops", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "celery[redis]>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "gitpython>=3.1.40,<4.0.0",
    "tree-sitter>=0.21.0,<1.0.0",
    "tree-sitter-python>=0.21.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "structlog>=24.0.0,<25.0.0",
    "typer>=0.9.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

semgrep = [
    "semgrep>=1.60.0,<2.0.0",
]

# llm extra is reserved for future LLM providers.
# Current Migration Agent talks to DeepSeek via httpx (src/integrations/llm_client.py),
# so no SDK dependency is required yet.
llm = []

[project.scripts]
codeguard = "src.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# lenient line length for modules that embed long multi-line string literals
# (LLM prompt templates and Jinja2 report templates) — wrapping them would alter content.
"src/agents/migration/llm_analyzer.py" = ["E501"]
"src/agents/reporter/agent.py" = ["E501"]
"src/engine/base_agent.py" = ["B027"]  # BaseAgent on_* hooks are optional template-method hook points, not mandatory abstractions
# Test files embed long non-splittable literals (mock JSON, prompts, expected outputs);
# wrapping them would change the tested data, so line length is exempted there.
"tests/unit/test_agents/test_migration/test_llm.py" = ["E501"]
"tests/unit/test_agents/test_migration/test_agent.py" = ["E501"]
"tests/unit/test_agents/test_reporter/test_agent.py" = ["E501"]
"tests/unit/test_agents/test_security/test_scanners.py" = ["E501"]
"tests/unit/test_api/test_routers.py" = ["E501", "SIM117"]  # nested context managers keep patch scope explicit
"tests/unit/test_integrations/test_github_client.py" = ["E501"]
"tests/unit/test_integrations/test_llm_client.py" = ["SIM117"]
"tests/unit/test_integrations/test_webhook_sender.py" = ["SIM117"]
"tests/unit/test_storage/test_cve_cache.py" = ["SIM105"]
"tests/unit/test_webhook/test_receiver.py" = ["E501", "SIM117"]  # nested context managers keep patch scope explicit
"tests/integration/test_full_pipeline.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
