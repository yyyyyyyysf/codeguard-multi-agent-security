[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeguard"
version = "0.1.0"
description = "Multi-Agent Code Repository Security Analysis Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CodeGuard Developer"}
]
keywords = ["security", "agent", "code-analysis", "cve", "devsecops", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "celery[redis]>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "gitpython>=3.1.40,<4.0.0",
    "tree-sitter>=0.21.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "structlog>=24.0.0,<25.0.0",
    "click>=8.1.0,<9.0.0",
    "typer>=0.9.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

semgrep = [
    "semgrep>=1.60.0,<2.0.0",
]

llm = [
    "openai>=1.30.0,<2.0.0",
]

[project.scripts]
codeguard = "src.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
