services:
  api:
    build: .
    container_name: codeguard-api
    command: uvicorn src.api.app:create_app --host 0.0.0.0 --port 8000 --reload --factory
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - codeguard_repos:/tmp/codeguard_repos
      - codeguard_reports:/tmp/codeguard_reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: .
    container_name: codeguard-worker
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - .:/app
      - codeguard_repos:/tmp/codeguard_repos
      - codeguard_reports:/tmp/codeguard_reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  codeguard_repos:
  codeguard_reports:
