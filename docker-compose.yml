version: "3.9"

services:
  api:
    build: .
    container_name: codeguard-api
    command: uvicorn src.api.app:create_app --host 0.0.0.0 --port 8000 --reload --factory
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - codeguard_repos:/tmp/codeguard_repos
      - codeguard_reports:/tmp/codeguard_reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: codeguard-worker
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - .:/app
      - codeguard_repos:/tmp/codeguard_repos
      - codeguard_reports:/tmp/codeguard_reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codeguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  codeguard_repos:
  codeguard_reports:
