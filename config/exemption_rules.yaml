# CodeGuard Exemption Rules (Sample)
# These rules are used by the ConflictResolution Agent for auto-verdict.

rules:
  - rule_id: "sample-cve-whitelist"
    rule_type: cve_whitelist
    pattern: "CVE-2024-0001"
    scope: global
    reason: "This CVE has been verified as not exploitable in our environment"
    created_by: "admin"
    enabled: true

  - rule_id: "sample-path-whitelist"
    rule_type: path_whitelist
    pattern: "tests/**"
    scope: global
    reason: "Test files are not deployed to production"
    created_by: "admin"
    enabled: true

  - rule_id: "sample-severity-downgrade"
    rule_type: severity_downgrade
    pattern: "medium"
    scope: global
    reason: "Medium severity findings are downgraded to info for MVP"
    created_by: "admin"
    enabled: true
